{"name": "migrate5", "on": {"push": {"paths": [".github/workflows/migrate5.yml"]}}, "permissions": {"contents": "write"}, "jobs": {"m": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"run": "python3 - <<'PYEOF'\nimport os, sys, json, subprocess\nif os.path.exists('manifest.json'):\n    sys.exit(0)\nos.makedirs('icons', exist_ok=True)\ndef icon(name, n, pad):\n    k = int(n * (1 - 2 * pad))\n    subprocess.check_call(['convert', 'logo.jpg', '-resize', '%dx%d' % (k, k), '-background', 'white', '-gravity', 'center', '-extent', '%dx%d' % (n, n), 'icons/' + name])\nicon('icon-192.png', 192, 0.08)\nicon('icon-512.png', 512, 0.08)\nicon('icon-maskable.png', 512, 0.18)\nicon('apple-touch-icon.png', 180, 0.08)\nm = {\"name\": \"محمد بدر - ركن الستاير\", \"short_name\": \"محمد بدر\", \"lang\": \"ar\", \"dir\": \"rtl\",\n     \"start_url\": \"./\", \"scope\": \"./\", \"display\": \"standalone\",\n     \"background_color\": \"#ffffff\", \"theme_color\": \"#b8893c\",\n     \"icons\": [{\"src\": \"icons/icon-192.png\", \"sizes\": \"192x192\", \"type\": \"image/png\"},\n               {\"src\": \"icons/icon-512.png\", \"sizes\": \"512x512\", \"type\": \"image/png\"},\n               {\"src\": \"icons/icon-maskable.png\", \"sizes\": \"512x512\", \"type\": \"image/png\", \"purpose\": \"maskable\"}]}\nopen('manifest.json', 'w', encoding='utf8').write(json.dumps(m, ensure_ascii=False, indent=1))\nopen('sw.js', 'w').write(\"self.addEventListener('install',e=>self.skipWaiting());\\nself.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));\\nself.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open('v1').then(x=>x.put(e.request,c)).catch(()=>{});return r}).catch(()=>caches.match(e.request)))});\\n\")\ns = open('index.html', encoding='utf8').read()\ntags = '<link rel=\"manifest\" href=\"manifest.json\"><meta name=\"theme-color\" content=\"#b8893c\"><link rel=\"apple-touch-icon\" href=\"icons/apple-touch-icon.png\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-title\" content=\"محمد بدر\">'\nreg = \"<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))</script>\"\ns = s.replace('</head>', tags + '</head>', 1)\ns = s.replace('</body>', reg + '</body>', 1)\nopen('index.html', 'w', encoding='utf8').write(s)\nsubprocess.check_call(['git', 'config', 'user.name', 'site'])\nsubprocess.check_call(['git', 'config', 'user.email', 'site@users.noreply.github.com'])\nsubprocess.check_call(['git', 'add', '-A'])\nsubprocess.check_call(['git', 'commit', '-m', 'app version'])\nsubprocess.check_call(['git', 'push'])\nPYEOF"}]}}}
