{"name": "migrate", "on": {"push": {"paths": [".github/workflows/migrate.yml"]}}, "permissions": {"contents": "write"}, "jobs": {"m": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"run": "python3 - <<'PYEOF'\nimport re, base64, os, sys\nif os.path.exists('images/photo-01.jpg'):\n    sys.exit(0)\ns = open('index.html', encoding='utf8').read()\ntag = '<div class=\"strip g\">'\na = s.index(tag) + len(tag)\nb = s.index('</div></section>', a)\nimgs = re.findall(r'src=\"data:image/jpeg;base64,([^\"]+)\"', s[a:b])\nos.makedirs('images', exist_ok=True)\nnames = []\nfor n, d in enumerate(imgs, 1):\n    nm = 'photo-%02d.jpg' % n\n    open('images/' + nm, 'wb').write(base64.b64decode(d))\n    names.append(nm)\nfigs = ''.join('<figure><img loading=\"lazy\" src=\"images/%s\" alt=\"من شغلنا: ركنة وكنب من أعمالنا\"></figure>' % nm for nm in names)\njs = \"\"\"<script>fetch('https://api.github.com/repos/mohamedbadr-curtains/mohamedbadr-curtains.github.io/contents/images').then(function(r){return r.json()}).then(function(l){var g=document.querySelector('.g');var have={};g.querySelectorAll('img').forEach(function(i){have[decodeURIComponent(i.getAttribute('src').split('/').pop())]=1});l.filter(function(f){return /\\\\.(jpe?g|png|webp|gif)$/i.test(f.name)&&!have[f.name]}).sort(function(x,y){return x.name.localeCompare(y.name)}).forEach(function(f){var fg=document.createElement('figure');var im=document.createElement('img');im.loading='lazy';im.alt='من شغلنا';im.src='images/'+encodeURIComponent(f.name);fg.appendChild(im);g.insertBefore(fg,g.firstChild)})}).catch(function(){});</script>\"\"\"\nnew = s[:a] + figs + s[b:]\nnew = new.replace('</body>', js + '</body>', 1)\nopen('index.html', 'w', encoding='utf8').write(new)\nprint(len(imgs), len(new))\nPYEOF\ngit config user.name github-actions\ngit config user.email actions@users.noreply.github.com\ngit add -A\ngit commit -m 'Move photos to images folder' || exit 0\ngit push\n"}]}}}
