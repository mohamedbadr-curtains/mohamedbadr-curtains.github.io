{"name": "migrate3", "on": {"push": {"paths": [".github/workflows/migrate3.yml"]}}, "permissions": {"contents": "write"}, "jobs": {"m": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"run": "python3 - <<'PYEOF'\nimport os, sys, re, base64\nif os.path.exists('colors.txt'):\n    sys.exit(0)\nC = \"\"\"# ألوان الموقع. غيّر الكود اللي بعد النقطتين بس (زي #7a1f3d)، وسيب اسم البند زي ما هو.\n# لو مسحت سطر أو كتبت لون غلط، الموقع بيرجع للون القديم بتاعه.\nbackground: #f6f1ea\ntext: #2b2326\naccent: #b8893c\nbutton: #7a1f3d\nbutton-text: #ffffff\nsmall-text: #5d5155\n\"\"\"\nopen('colors.txt', 'w', encoding='utf8').write(C)\ns = open('index.html', encoding='utf8').read()\nm = re.search(r'(<img class=\"logo\" src=\")data:image/jpeg;base64,([^\"]+)(\")', s)\nopen('logo.jpg', 'wb').write(base64.b64decode(m.group(2)))\ns = s[:m.start()] + m.group(1) + 'logo.jpg' + m.group(3) + s[m.end():]\nJS = r'''<script>(function(){fetch('colors.txt?'+Date.now()).then(function(r){return r.ok?r.text():''}).then(function(t){var d={};t.split(/\\r?\\n/).forEach(function(l){l=l.trim();if(!l||l.charAt(0)==='#')return;var i=l.indexOf(':');if(i<1)return;var k=l.slice(0,i).trim().toLowerCase();var v=l.slice(i+1).trim();if(v&&window.CSS&&CSS.supports('color',v))d[k]=v});\nvar c='';if(d.background)c+='body{background:'+d.background+'}';if(d.text)c+='body{color:'+d.text+'}';if(d.accent)c+='h2{border-inline-start-color:'+d.accent+'}';if(d.button)c+='.btn{border-color:'+d.button+';color:'+d.button+'}.btn.p{background:'+d.button+'}';if(d['button-text'])c+='.btn.p{color:'+d['button-text']+'}';if(d['small-text'])c+='.svc span{color:'+d['small-text']+'}';\nif(c){var st=document.createElement('style');st.textContent=c;document.head.appendChild(st)}}).catch(function(){})})();</script>'''\ns = s.replace('</body>', JS + '</body>', 1)\nopen('index.html', 'w', encoding='utf8').write(s)\nprint('ok')\nPYEOF\ngit config user.name github-actions\ngit config user.email actions@users.noreply.github.com\ngit add -A\ngit commit -m 'Add colors.txt and logo.jpg' || exit 0\ngit push\n"}]}}}
