{"name": "migrate4", "on": {"push": {"paths": [".github/workflows/migrate4.yml"]}}, "permissions": {"contents": "write"}, "jobs": {"m": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"run": "python3 - <<'PYEOF'\nimport os, re, sys, subprocess\nif os.path.isdir('images/corner'):\n    sys.exit(0)\nCUR = {'IMG-20261126-WA0059.jpg', 'photo-17.jpg'}\nBED = {'photo-29.jpg', 'photo-37.jpg'}\ncats = {'curtains': [], 'corner': [], 'beds': []}\nfiles = sorted(f for f in os.listdir('images') if os.path.isfile('images/' + f) and f.lower().endswith(('.jpg', '.jpeg', '.png')))\nimgs = sorted([f for f in files if f.startswith('IMG')], reverse=True)\nphotos = sorted([f for f in files if not f.startswith('IMG')])\nfor f in imgs + photos:\n    c = 'curtains' if f in CUR else 'beds' if f in BED else 'corner'\n    os.makedirs('images/' + c, exist_ok=True)\n    subprocess.check_call(['git', 'mv', 'images/' + f, 'images/' + c + '/' + f])\n    cats[c].append(f)\nos.makedirs('images/other', exist_ok=True) if False else None\ns = open('index.html', encoding='utf8').read()\ndef figs(c):\n    return ''.join('<figure><img loading=\"lazy\" src=\"images/%s/%s\" alt=\"من شغلنا\"></figure>' % (c, f) for f in cats[c])\ndef sec(c, title, folder=None):\n    folder = c if folder is None else folder\n    return '<section class=\"work\"><h2>%s</h2><div class=\"strip g\" data-folder=\"%s\">%s</div></section>' % (title, folder, figs(c) if c in cats else '')\nnew = sec('curtains', 'ستاير') + sec('corner', 'ركن') + sec('beds', 'سراير') + '<section class=\"work\" hidden><h2>أعمال جديدة</h2><div class=\"strip g\" data-folder=\"\"></div></section>'\na = s.index('<section><h2>من شغلنا</h2>')\nb = s.index('</div></section>', a) + len('</div></section>')\ns = s[:a] + new + s[b:]\ns = re.sub(r\"<script>fetch\\('https://api\\.github\\.com/repos/[^<]*</script>\", '', s, count=1)\ns = s.replace(\"'order-title','work-title',\", \"'order-title','work-curtains-title','work-corner-title','work-beds-title','work-other-title',\", 1)\nJS = r'''<script>(function(){var API='https://api.github.com/repos/mohamedbadr-curtains/mohamedbadr-curtains.github.io/contents/images';function ok(n){return /\\.(jpe?g|png|webp|gif)$/i.test(n)}\ndocument.querySelectorAll('.g[data-folder]').forEach(function(g){var f=g.getAttribute('data-folder');var sec=g.parentNode;function fin(){sec.hidden=!g.querySelector('figure')}fin();\nfetch(API+(f?'/'+f:'')).then(function(r){return r.json()}).then(function(l){if(!Array.isArray(l))return;var names={};var files=l.filter(function(x){return x.type==='file'&&ok(x.name)});files.forEach(function(x){names[x.name]=1});\nvar have={};g.querySelectorAll('figure').forEach(function(fg){var n=decodeURIComponent(fg.querySelector('img').getAttribute('src').split('/').pop());if(!names[n])fg.remove();else have[n]=1});\nfiles.filter(function(x){return !have[x.name]}).sort(function(x,y){return x.name.localeCompare(y.name)}).forEach(function(x){var fg=document.createElement('figure');var im=document.createElement('img');im.loading='lazy';im.alt='من شغلنا';im.src='images/'+(f?f+'/':'')+encodeURIComponent(x.name);fg.appendChild(im);g.insertBefore(fg,g.firstChild)});fin()}).catch(function(){})})})();</script>'''\ns = s.replace('</body>', JS + '</body>', 1)\nopen('index.html', 'w', encoding='utf8').write(s)\nif os.path.exists('texts.txt'):\n    t = open('texts.txt', encoding='utf8').read()\n    t = re.sub(r'^work-title:.*$', 'work-curtains-title: ستاير\\nwork-corner-title: ركن\\nwork-beds-title: سراير\\nwork-other-title: أعمال جديدة', t, count=1, flags=re.M)\n    open('texts.txt', 'w', encoding='utf8').write(t)\nprint({k: len(v) for k, v in cats.items()})\nPYEOF\ngit config user.name github-actions\ngit config user.email actions@users.noreply.github.com\ngit add -A\ngit commit -m 'Split gallery into curtains, corner, beds folders' || exit 0\ngit push\n"}]}}}
