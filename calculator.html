<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احسب سعر ستارتك | محمد بدر للستاير والركن</title>
<style>
  :root { --gold:#c9a35c; --dark:#1c1a17; --card:#26231f; --text:#f3ede3; --muted:#b8ad99; }
  * { box-sizing: border-box; margin:0; padding:0; font-family:'Segoe UI', Tahoma, sans-serif; }
  body { background:var(--dark); color:var(--text); min-height:100vh; padding:20px 16px 60px; }
  .wrap { max-width:480px; margin:0 auto; }
  h1 { font-size:22px; color:var(--gold); text-align:center; margin-bottom:4px; }
  .sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:24px; }
  .card { background:var(--card); border-radius:16px; padding:20px; margin-bottom:16px; border:1px solid #3a352d; }
  label { display:block; font-size:14px; margin-bottom:8px; color:var(--muted); }
  input[type=number], select { width:100%; padding:12px; border-radius:10px; border:1px solid #4a4438; background:#1c1a17; color:var(--text); font-size:16px; margin-bottom:16px; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  .check { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--text); margin-bottom:8px; }
  .check input { width:20px; height:20px; accent-color:var(--gold); }
  .result { text-align:center; display:none; }
  .price { font-size:34px; color:var(--gold); font-weight:bold; margin:8px 0; }
  .note { font-size:12px; color:var(--muted); line-height:1.8; }
  .wa { display:block; text-align:center; background:#25d366; color:#fff; text-decoration:none; font-size:17px; font-weight:bold; padding:16px; border-radius:12px; margin-top:14px; }
  .calc { display:block; width:100%; background:var(--gold); color:#1c1a17; border:none; font-size:17px; font-weight:bold; padding:16px; border-radius:12px; cursor:pointer; }
  .back { display:block; text-align:center; color:var(--muted); margin-top:18px; font-size:13px; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>احسب سعر ستارتك في دقيقة</h1>
  <p class="sub">محمد بدر للستاير والركن والمفروشات، شبين الكوم</p>

  <div class="card">
    <label>مقاس الحيطة (عرض × ارتفاع) بالمتر</label>
    <div class="row">
      <div><input type="number" id="w" placeholder="العرض مثلا 3" min="0.5" step="0.1" inputmode="decimal"></div>
      <div><input type="number" id="h" placeholder="الارتفاع مثلا 2.7" min="0.5" step="0.1" inputmode="decimal"></div>
    </div>

    <label>نوع القماش</label>
    <select id="fabric">
      <option value="eco">اقتصادي</option>
      <option value="std" selected>ستاندرد</option>
      <option value="lux">فاخر</option>
    </select>

    <label>الموديل</label>
    <select id="style">
      <option value="plain">شق عادي</option>
      <option value="pleat">بليسيه</option>
      <option value="blackout">بلاك آوت</option>
    </select>

    <div class="check"><input type="checkbox" id="install" checked><span>مع التركيب</span></div>
  </div>

  <button class="calc" onclick="calc()">احسب السعر</button>

  <div class="card result" id="result">
    <div>السعر الاسترشادي</div>
    <div class="price" id="price"></div>
    <p class="note">ده سعر تقريبي عشان تاخد فكرة. السعر النهائي بيتحدد بعد المعاينة واختيار القماش الفعلي.</p>
    <a class="wa" id="waBtn" href="#">كمل الطلب على واتساب</a>
  </div>

  <a class="back" href="/">ارجع للموقع الرئيسي</a>
</div>

<script>
// الأسعار دي استرشادية وتتعدل من هنا بسهولة (سعر المتر المربع بالجنيه)
const FABRIC = { eco: 250, std: 400, lux: 650 };
const STYLE  = { plain: 1.0, pleat: 1.3, blackout: 1.5 };
const INSTALL = 150; // تكلفة تركيب ثابتة للقطة
const PHONE = '201009397269';

function calc() {
  const w = parseFloat(document.getElementById('w').value);
  const h = parseFloat(document.getElementById('h').value);
  if (!w || !h || w <= 0 || h <= 0) { alert('اكتب العرض والارتفاع الأول'); return; }
  const fabric = document.getElementById('fabric').value;
  const style = document.getElementById('style').value;
  const install = document.getElementById('install').checked;

  const area = w * h;
  let total = area * FABRIC[fabric] * STYLE[style];
  if (install) total += INSTALL;
  // نطاق تقريبي: من -10% لـ +15%
  const lo = Math.round(total * 0.9 / 10) * 10;
  const hi = Math.round(total * 1.15 / 10) * 10;

  document.getElementById('price').textContent = lo.toLocaleString('ar-EG') + ' - ' + hi.toLocaleString('ar-EG') + ' جنيه';

  const fabricName = document.getElementById('fabric').selectedOptions[0].text;
  const styleName = document.getElementById('style').selectedOptions[0].text;
  const msg = 'أهلاً، حسبت سعر ستارة من الموقع:\n' +
    'المقاس: ' + w + ' × ' + h + ' متر\n' +
    'القماش: ' + fabricName + '\n' +
    'الموديل: ' + styleName + '\n' +
    'التركيب: ' + (install ? 'نعم' : 'لا') + '\n' +
    'عايز أعرف السعر النهائي';
  document.getElementById('waBtn').href = 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(msg);
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
